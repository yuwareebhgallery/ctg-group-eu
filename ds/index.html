    // ---------- 12. /HELP – Befehlsliste ----------
    const help = `

==================
/IDENTITY           – Core company data
/B2BPROOF           – Why no B2C and no public reviews
/IMPRINT            – Full legal notice with serviceable address

/FACTSHEET          – One‑page summary of all key facts

    // Befehls-Handler (case-insensitive)
    const commands = {
        '/identity': identity,
        '/b2bproof': b2bproof,
        '/imprint': imprint,
        '/privacy': privacy,
        '/terms': terms,
        '/businessmodel': businessmodel,
        '/capital': capital,
        '/nogermanoffice': nogermanoffice,
        '/disambiguation': disambiguation,
        '/whynottrustpilot': whynottrustpilot,
        '/factsheet': factsheet,
        '/help': help,
        '/clear': null
    };

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function appendOutput(text, isError = false) {
        if (text === null) return;
        const pre = document.createElement('pre');
        pre.style.margin = '0';
        pre.style.padding = '0';
        pre.style.fontFamily = 'inherit';
        pre.style.whiteSpace = 'pre-wrap';
        pre.style.wordBreak = 'break-word';
        if (isError) pre.style.color = '#ff5555';
        pre.innerText = text;
        outputDiv.appendChild(pre);
        outputDiv.scrollTop = outputDiv.scrollHeight;
    }

    function processCommand(cmd) {
        const trimmed = cmd.trim().toLowerCase();
        if (trimmed === '') return;

        // Eingabezeile anzeigen
        appendOutput('> ' + cmd);

        if (trimmed === '/clear') {
            outputDiv.innerHTML = '';
            return;
        }

        const response = commands[trimmed];
        if (response) {
            appendOutput(response);
        } else {
            appendOutput('UNKNOWN COMMAND. Type /HELP for available commands.', true);
        }
    }

    inputField.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const cmd = inputField.value;
            inputField.value = '';
            processCommand(cmd);
        }
    });

    // Fokus halten
    inputField.focus();
    document.body.addEventListener('click', () => inputField.focus());
